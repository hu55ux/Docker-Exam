# CI/CD Pipeline - Automatic AWS Deployment Enabled
name: CI/CD Pipeline # Pipeline-ın adı

on: # Pipeline-ın hansı hadisələrdə işə düşəcəyi
  push: # Kod push olunduqda
    branches: [ "main" ] # Yalnız "main" branch-ına push edildikdə
  pull_request: # Pull request açıldıqda
    branches: [ "main" ] # Yalnız "main" branch-ına PR açıldıqda

jobs: # İşlərin (jobs) siyahısı
  # Mərhələ 1: Tətbiqin test edilməsi
  test:
    runs-on: ubuntu-latest # Ən son Ubuntu virtual maşınında işləsin
    steps: # Bu iş daxilində yerinə yetiriləcək addımlar
      - uses: actions/checkout@v4 # Kodu GitHub runner-a kopyalayır

      - name: Setup .NET # .NET mühitini qurur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore dependencies
        run: dotnet restore Master/Master.sln
      - name: Run Backend Tests
        run: dotnet test Master/Master.sln --no-restore --verbosity normal

  # Mərhələ 2: Docker imiclərinin yığılması və Docker Hub-a göndərilməsi
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Master
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/master-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Masterrio
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/master-frontend:latest

  # Mərhələ 3: AWS EC2-yə avtomatik qoşulma və deployment
  aws_vm_deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          script: |
            # Layihə qovluğuna keçirik (yoxdursa clone edirik)
            if [ ! -d "Docker-Exam" ]; then
              sudo git clone https://github.com/hu55ux/Docker-Exam.git
            fi
            cd Docker-Exam

            # Ən son kodu çəkirik
            sudo git pull origin main

            # Yeni Docker imiclərini çəkirik
            sudo docker-compose pull

            # Konteynerləri yenidən başladırıq
            sudo docker-compose down
            sudo docker-compose up -d

            # Köhnə imicləri təmizləyirik
            sudo docker image prune -f
